stages:
  - format
  - build
  - godot
  - sanitize

variables:
  CPM_SOURCE_CACHE: "$CI_PROJECT_DIR/.cpm-cache"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cpm-cache/

format-check:
  stage: format
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang-format cmake git ninja-build g++ python3
  script:
    - cmake --preset linux-debug
    - cmake --build --preset linux-debug --target format-check

clang-debug-test:
  stage: build
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3
  script:
    - CC=clang CXX=clang++ cmake --preset linux-debug
    - cmake --build --preset linux-debug
    - ctest --preset linux-debug --output-on-failure

gcc-release-test:
  stage: build
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates cmake git ninja-build g++ python3
  script:
    - cmake --preset linux-release
    - cmake --build --preset linux-release
    - ctest --preset linux-release --output-on-failure

godot-4.7.1-headless-test:
  stage: godot
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates cmake curl g++ ninja-build python3 unzip
    - curl -fL https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/godot.zip
    - unzip -q /tmp/godot.zip -d /tmp/godot
    - chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
  script:
    - cmake --preset linux-debug
    - cmake --build --preset linux-debug
    - XDG_CONFIG_HOME=/tmp/dross-godot-config XDG_CACHE_HOME=/tmp/dross-godot-cache XDG_DATA_HOME=/tmp/dross-godot-data /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --editor --quit
    - XDG_CONFIG_HOME=/tmp/dross-godot-config XDG_CACHE_HOME=/tmp/dross-godot-cache XDG_DATA_HOME=/tmp/dross-godot-data /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot -s res://tests/run_phase08.gd

asan-ubsan-test:
  stage: sanitize
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3
  script:
    - CC=clang CXX=clang++ cmake --preset linux-asan-ubsan
    - cmake --build --preset linux-asan-ubsan
    - ctest --preset linux-asan-ubsan --output-on-failure
