stages:
  - format
  - generate
  - build
  - godot
  - sanitize

variables:
  CPM_SOURCE_CACHE: "$CI_PROJECT_DIR/.cpm-cache"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cpm-cache/

format-check:
  stage: format
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang-format cmake git ninja-build g++ python3
  script:
    - cmake --preset linux-debug
    - cmake --build --preset linux-debug --target format-check

generated-api-check:
  stage: generate
  image: python:3.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --disable-pip-version-check -r tools/dross_cli/requirements.lock
  script:
    - ./bin/dross generate all
    - ./bin/dross check generated
    - python -m pytest -q tools/dross_cli/tests
    - git diff --exit-code

clang-debug-test:
  stage: build
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3
  script:
    - CC=clang CXX=clang++ cmake --preset linux-debug
    - cmake --build --preset linux-debug
    - ctest --preset linux-debug --output-on-failure
    - build/linux-debug/dross_headless replay --verify-checkpoints tests/fixtures/thump-v1.dross-replay

gcc-release-test:
  stage: build
  image: debian:stable-slim
  cache: []
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates cmake git ninja-build g++ python3
  script:
    - cmake --preset linux-release
    - cmake --build --preset linux-release
    - ctest --preset linux-release --output-on-failure
    - build/linux-release/dross_headless replay --verify-checkpoints tests/fixtures/thump-v1.dross-replay

windows-msvc-replay-test:
  stage: build
  tags:
    - windows
  when: manual
  allow_failure: true
  script:
    - cmake --preset windows-msvc-release
    - cmake --build --preset windows-msvc-release
    - ctest --preset windows-msvc-release --output-on-failure
    - build/windows-msvc-release/dross_headless.exe replay --verify-checkpoints tests/fixtures/thump-v1.dross-replay

clang-tidy:
  stage: build
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang clang-tidy cmake git ninja-build python3
  script:
    - CC=clang CXX=clang++ cmake --preset linux-debug
    - cmake --build --preset linux-debug --target tidy

godot-4.7.1-headless-test:
  stage: godot
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates cmake curl g++ ninja-build python3 unzip
    - curl -fL https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/godot.zip
    - unzip -q /tmp/godot.zip -d /tmp/godot
    - chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
  script:
    - cmake --preset linux-debug
    - cmake --build --preset linux-debug
    - XDG_CONFIG_HOME=/tmp/dross-godot-config XDG_CACHE_HOME=/tmp/dross-godot-cache XDG_DATA_HOME=/tmp/dross-godot-data /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --editor --quit
    - XDG_CONFIG_HOME=/tmp/dross-godot-config XDG_CACHE_HOME=/tmp/dross-godot-cache XDG_DATA_HOME=/tmp/dross-godot-data /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path godot -s res://tests/run_all.gd
    - cd godot && XDG_CONFIG_HOME=/tmp/dross-godot-config XDG_CACHE_HOME=/tmp/dross-godot-cache XDG_DATA_HOME=/tmp/dross-godot-data /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests/DrossBoundaryTest.gd
    - cd "$CI_PROJECT_DIR"
    - GODOT_BIN=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 bin/package-linux /tmp/dross-package
    - cd /tmp/dross-package && sha256sum -c SHA256SUMS
    - cp smoke.log "$CI_PROJECT_DIR/build/phase14-package-smoke.log"
  artifacts:
    when: always
    paths:
      - build/phase14-package-smoke.log
    expire_in: 1 week

asan-ubsan-test:
  stage: sanitize
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3
  script:
    - CC=clang CXX=clang++ cmake --preset linux-asan-ubsan
    - cmake --build --preset linux-asan-ubsan
    - ctest --preset linux-asan-ubsan --output-on-failure
    - build/linux-asan-ubsan/dross_headless replay --verify-checkpoints tests/fixtures/thump-v1.dross-replay
