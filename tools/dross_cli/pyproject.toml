[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dross-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Jinja2==3.1.6",
  "PyYAML==6.0.2",
  "pydantic==2.11.7",
  "typer==0.16.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
dross = "dross_cli.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
